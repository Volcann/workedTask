name: CI

on:
  push:
    branches: [main, feat/v2, feat/v3]
  pull_request:
    branches: [main, feat/v2, feat/v3]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ghToolkit dependency
        uses: actions/checkout@v4
        with:
          repository: Volcann/ghToolkit
          path: _ghToolkit

      - name: Move ghToolkit to sibling directory
        run: mv _ghToolkit ../ghToolkit

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ../ghToolkit -e ".[dev]" "ruff==0.17.2"

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with pytest
        run: uv run pytest
