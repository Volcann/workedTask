name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ghToolkit dependency
        uses: actions/checkout@v4
        with:
          repository: Volcann/ghToolkit
          path: _ghToolkit

      - name: Move ghToolkit to sibling directory
        run: mv _ghToolkit ../ghToolkit

      - name: Patch absolute path for dependencies
        run: |
          GH_TOOLKIT_ABS="${GITHUB_WORKSPACE}/../ghToolkit"
          # Patch pyproject.toml (uses PEP 508 file:// URL syntax)
          sed -i "s|ghtoolkit @ .*ghToolkit|ghtoolkit @ file://${GH_TOOLKIT_ABS}|g" pyproject.toml
          # Patch uv.lock: replace both editable and non-editable path forms
          sed -i "s|editable = \"[^\"]*ghToolkit\"|editable = \"${GH_TOOLKIT_ABS}\"|g" uv.lock
          sed -i "s|path = \"[^\"]*ghToolkit\"|path = \"${GH_TOOLKIT_ABS}\"|g" uv.lock

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv venv
          uv sync --extra dev --frozen

      - name: Lint with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests with pytest
        run: uv run pytest