[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "status-reporter"
version = "0.2.0"
description = "Daily work reports using centralized ghToolkit activity, shift policy, and per-PR AI chunks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ghtoolkit>=0.2.0,<0.3.0", "tzdata>=2024.1"]

[project.optional-dependencies]
ai = ["google-genai>=1,<2"]
dev = [
    "pytest>=8.0.0",
    "ruff==0.17.2",
]

[project.scripts]
worked-task = "cli.commands:main"
status-report = "cli.commands:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ai*", "cli*", "extractors*", "report*", "utils*", "validator*", "config*", "status_reporter_auth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E501",  # Line length is handled by the formatter.
    "DTZ001",  # Existing datetime construction uses local time.
    "PYI034",
    "PYI036",
    "TRY004",  # Config parsing raises ValueError for invalid input.
    "S110",  # Optional model lookup falls back when unavailable.
    "S112",
    "FURB162",
    "I001",  # Preserve existing import layout until it is reformatted separately.
]
